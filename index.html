<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Калькулятор Рассрочки PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@lucide/lucide@latest"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }
        
        @keyframes slideIn {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast {
            animation: slideIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const Icon = ({ name, className }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        function App() {
            const [amount, setAmount] = useState('');
            const [downPayment, setDownPayment] = useState('');
            const [extraCharge, setExtraCharge] = useState(''); 
            const [isAutoExtra, setIsAutoExtra] = useState(false);
            const [months, setMonths] = useState(''); 
            const [markupRate, setMarkupRate] = useState(''); 
            const [showToast, setShowToast] = useState(false);

            const handleReset = () => {
                setAmount('');
                setDownPayment('');
                setExtraCharge('');
                setMonths('');
                setMarkupRate('');
                setIsAutoExtra(false);
            };

            const autoExtraValue = useMemo(() => {
                if (!isAutoExtra) return null;
                const p = parseFloat(amount) || 0;
                if (p < 1000) return 0;
                if (p < 10000) return 1000;
                if (p < 12500) return 1100;
                if (p < 15000) return 1150;
                if (p < 20000) return 1200;
                if (p < 25000) return 1250;
                if (p < 30000) return 1300;
                if (p < 35000) return 1350;
                if (p < 40000) return 1400;
                if (p < 45000) return 1450;
                if (p < 50000) return 1500;
                if (p < 60000) return 1600;
                if (p < 70000) return 1700;
                if (p < 80000) return 1800;
                if (p < 90000) return 2000;
                if (p <= 100000) return 3000;
                return 3000; 
            }, [amount, isAutoExtra]);

            const calculations = useMemo(() => {
                const base = parseFloat(amount) || 0;
                const fixedExtra = isAutoExtra ? (autoExtraValue || 0) : (parseFloat(extraCharge) || 0);
                const dur = parseInt(months) || 0;
                const rate = parseFloat(markupRate) || 0;
                
                const isZeroMode = downPayment === "0";
                const isFieldEmpty = downPayment === '';
                const initialInput = parseFloat(downPayment) || 0;

                if (base <= 0 || dur <= 0) return { monthly: 0, total: 0, schedule: [] };

                const baseWithExtra = base + fixedExtra;
                const totalWithMarkup = baseWithExtra + (baseWithExtra * (rate / 100));
                
                let schedule = [];
                let monthlyRounded = 0;
                let totalFinal = 0;
                const startDate = new Date();

                // Сдвигаем начало отсчета, если нет взноса
                const dateOffset = isZeroMode ? 1 : 0;

                const getFormattedDate = (idx) => {
                    const d = new Date(startDate);
                    d.setMonth(startDate.getMonth() + idx + dateOffset);
                    const day = String(d.getDate()).padStart(2, '0');
                    const month = String(d.getMonth() + 1).padStart(2, '0');
                    const year = d.getFullYear();
                    return `${day}.${month}.${year}`;
                };

                if (isZeroMode) {
                    const monthlyExact = totalWithMarkup / dur;
                    monthlyRounded = Math.ceil(monthlyExact / 50) * 50;
                    totalFinal = monthlyRounded * dur;

                    for (let i = 0; i < dur; i++) {
                        schedule.push({
                            id: i + 1,
                            date: getFormattedDate(i),
                            pay: monthlyRounded,
                            label: `Пл. ${i + 1}`,
                            remain: Math.max(0, totalFinal - (monthlyRounded * (i + 1)))
                        });
                    }
                } else if (isFieldEmpty) {
                    const monthlyExact = totalWithMarkup / dur;
                    monthlyRounded = Math.ceil(monthlyExact / 50) * 50;
                    totalFinal = monthlyRounded * dur;

                    for (let i = 0; i < dur; i++) {
                        schedule.push({
                            id: i + 1,
                            date: getFormattedDate(i),
                            pay: monthlyRounded,
                            label: i === 0 ? 'Взнос' : `Пл. ${i + 1}`,
                            remain: Math.max(0, totalFinal - (monthlyRounded * (i + 1)))
                        });
                    }
                } else {
                    const initial = initialInput;
                    const remainingToFinance = Math.max(0, totalWithMarkup - initial);
                    const remainingMonths = Math.max(1, dur - 1);
                    const monthlyExact = dur > 1 ? remainingToFinance / remainingMonths : 0;
                    
                    monthlyRounded = Math.ceil(monthlyExact / 50) * 50;
                    totalFinal = initial + (monthlyRounded * (dur - 1 || 0));
                    if (dur === 1) totalFinal = initial;

                    schedule.push({
                        id: 1,
                        date: getFormattedDate(0),
                        pay: initial,
                        label: 'Взнос',
                        remain: Math.max(0, totalFinal - initial)
                    });

                    for (let i = 1; i < dur; i++) {
                        schedule.push({
                            id: i + 1,
                            date: getFormattedDate(i),
                            pay: monthlyRounded,
                            label: `Пл. ${i + 1}`,
                            remain: Math.max(0, totalFinal - (initial + monthlyRounded * i))
                        });
                    }
                }

                return { 
                    monthly: monthlyRounded, 
                    total: totalFinal, 
                    schedule, 
                    initialPay: isZeroMode ? 0 : (isFieldEmpty ? monthlyRounded : initialInput)
                };
            }, [amount, downPayment, extraCharge, isAutoExtra, autoExtraValue, months, markupRate]);

            const handleShare = () => {
                if (calculations.schedule.length === 0) return;
                
                let text = `📄 *РАСЧЕТ РАССРОЧКИ*\n`;
                text += `────────────────────\n`;
                text += `🏷 *Товар:* ${parseFloat(amount).toLocaleString('ru-RU')} ₽\n`;
                text += `🗓 *Срок:* ${months} мес.\n`;
                text += `💳 *Месячный платеж:* ${calculations.monthly.toLocaleString('ru-RU')} ₽\n`;
                text += `────────────────────\n`;
                text += `📅 *ГРАФИК:*\n`;
                
                calculations.schedule.forEach(row => {
                    text += `🔹 ${row.date} — *${row.pay.toLocaleString('ru-RU')} ₽*\n`;
                });

                text += `────────────────────\n`;
                text += `✅ *ИТОГО:* ${calculations.total.toLocaleString('ru-RU')} ₽`;

                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.left = "-9999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    setShowToast(true);
                    setTimeout(() => setShowToast(false), 3000);
                } catch (err) {}
                document.body.removeChild(textArea);
            };

            return (
                <div className="min-h-screen p-2 md:p-6 max-w-[1440px] mx-auto flex flex-col gap-4 text-slate-200">
                    <header className="bg-slate-800/60 backdrop-blur-md rounded-2xl p-3 md:p-4 border border-slate-700/50 flex items-center justify-between shadow-sm">
                        <div className="flex items-center gap-2 md:gap-3">
                            <div className="bg-blue-600 p-1.5 md:p-2 rounded-lg md:rounded-xl shadow-lg shadow-blue-900/20">
                                <Icon name="credit-card" className="text-white w-4 h-4 md:w-5 md:h-5" />
                            </div>
                            <h1 className="font-bold text-white text-sm md:text-lg leading-tight">Рассрочка PRO</h1>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={handleReset}
                                className="bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-2 rounded-xl text-[10px] md:text-xs font-bold transition-all flex items-center gap-2 shadow-lg active:scale-95 border border-slate-600/50">
                                <Icon name="refresh-cw" className="w-3 h-3 md:w-3.5 md:h-3.5" />
                                <span className="hidden sm:inline">Сброс</span>
                            </button>
                            <button onClick={handleShare} disabled={calculations.schedule.length === 0}
                                className="bg-blue-600 hover:bg-blue-500 text-white px-3 py-2 rounded-xl text-[10px] md:text-xs font-bold transition-all flex items-center gap-2 disabled:opacity-30 shadow-lg shadow-blue-900/20 active:scale-95">
                                <Icon name="share-2" className="w-3 h-3 md:w-3.5 md:h-3.5" />
                                <span>Копировать</span>
                            </button>
                        </div>
                    </header>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-4">
                        <div className="lg:col-span-4 xl:col-span-3 space-y-4">
                            <div className="bg-slate-800/40 rounded-2xl p-4 border border-slate-700/50 shadow-md">
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-[9px] font-black text-blue-400 uppercase mb-1.5 block tracking-widest text-center italic">Цена товара</label>
                                        <div className="relative">
                                            <input type="number" value={amount} onChange={e => setAmount(e.target.value)} placeholder="0"
                                                className="w-full bg-slate-900 border border-slate-700/50 text-white rounded-xl py-2.5 pl-9 pr-4 font-bold text-base focus:ring-2 focus:ring-blue-500 outline-none transition-all text-center" />
                                            <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 font-bold text-sm">₽</div>
                                        </div>
                                    </div>

                                    <div>
                                        <div className="flex justify-between items-center mb-1.5 px-1">
                                            <label className="text-[9px] font-black text-indigo-400 uppercase tracking-widest italic">Доп. наценка</label>
                                            <div className="flex items-center gap-1.5 cursor-pointer" onClick={() => setIsAutoExtra(!isAutoExtra)}>
                                                <span className={`text-[8px] font-bold uppercase ${isAutoExtra ? 'text-blue-400' : 'text-slate-500'}`}>Авто</span>
                                                <div className={`w-7 h-4 rounded-full p-0.5 transition-colors ${isAutoExtra ? 'bg-blue-600' : 'bg-slate-700'}`}>
                                                    <div className={`w-3 h-3 bg-white rounded-full transition-transform ${isAutoExtra ? 'translate-x-3' : 'translate-x-0'}`}></div>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="relative">
                                            <input 
                                                type="number" 
                                                value={isAutoExtra ? (autoExtraValue || '') : extraCharge} 
                                                onChange={e => setExtraCharge(e.target.value)} 
                                                disabled={isAutoExtra}
                                                placeholder={isAutoExtra ? "Авто" : "0"}
                                                className={`w-full border border-slate-700/50 rounded-xl py-2.5 pl-9 pr-4 font-bold text-base focus:ring-2 focus:ring-blue-500 outline-none transition-all text-center ${isAutoExtra ? 'bg-slate-800/50 text-blue-400 cursor-not-allowed' : 'bg-slate-900 text-indigo-400'}`} 
                                            />
                                            <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 font-bold text-sm">₽</div>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-[9px] font-black text-blue-400 uppercase mb-1.5 block tracking-widest text-center italic">% Наценки</label>
                                            <input type="number" value={markupRate} onChange={e => setMarkupRate(e.target.value)} placeholder="0"
                                                className="w-full bg-slate-900 border border-slate-700/50 text-white rounded-xl py-2.5 px-3 font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500 text-center" />
                                        </div>
                                        <div>
                                            <label className="text-[9px] font-black text-blue-400 uppercase mb-1.5 block tracking-widest text-center italic">Срок (мес)</label>
                                            <input type="number" value={months} onChange={e => setMonths(e.target.value)} placeholder="0"
                                                className="w-full bg-slate-900 border border-slate-700/50 text-white rounded-xl py-2.5 px-3 font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500 text-center" />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="text-[9px] font-black text-emerald-400 uppercase mb-1.5 block tracking-widest text-center italic">Первый взнос</label>
                                        <input type="number" value={downPayment} onChange={e => setDownPayment(e.target.value)} placeholder="Пусто = Авто"
                                            className="w-full bg-slate-900 border border-slate-700/50 text-emerald-400 rounded-xl py-2.5 px-4 font-bold text-sm focus:ring-2 focus:ring-emerald-500 outline-none transition-all placeholder:text-slate-600 text-center" />
                                        <div className="mt-2 text-[8px] text-center font-bold text-slate-500 uppercase px-1 leading-tight">
                                            {downPayment === "0" ? "Без взноса (с 2-го месяца)" : "Пусто: Авто-взнос сегодня"}
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-gradient-to-br from-blue-600 to-indigo-700 rounded-2xl p-5 text-white shadow-xl relative text-center overflow-hidden">
                                <div className="absolute -right-4 -top-4 opacity-10 rotate-12">
                                    <Icon name="calculator" className="w-20 h-20" />
                                </div>
                                <p className="text-blue-100 text-[9px] font-black uppercase mb-1 tracking-[0.2em] relative z-10">Ежемесячно</p>
                                <div className="text-3xl font-black tabular-nums tracking-tight relative z-10">{calculations.monthly.toLocaleString('ru-RU')} ₽</div>
                                <div className="mt-3 pt-3 border-t border-white/10 flex justify-between items-end relative z-10">
                                    <span className="text-[9px] text-blue-100 font-bold uppercase tracking-widest">Итого:</span>
                                    <span className="text-base font-bold">{calculations.total.toLocaleString('ru-RU')} ₽</span>
                                </div>
                            </div>
                        </div>

                        <div className="lg:col-span-8 xl:col-span-9 flex flex-col h-full">
                            <div className="bg-slate-800/40 rounded-2xl border border-slate-700/50 overflow-hidden flex flex-col h-full shadow-md">
                                <div className="px-4 py-3 border-b border-slate-700/50 bg-slate-800/30 flex items-center justify-between">
                                    <h2 className="text-[10px] font-black text-slate-400 uppercase tracking-widest flex items-center gap-2 italic">
                                        <Icon name="list" className="w-3 h-3 text-blue-500" />
                                        График платежей
                                    </h2>
                                </div>
                                <div className="overflow-x-hidden overflow-y-auto max-h-[550px] lg:max-h-none flex-1 custom-scrollbar">
                                    <table className="w-full text-left border-collapse table-fixed">
                                        <thead className="bg-slate-800 sticky top-0 z-10">
                                            <tr className="text-[9px] font-black text-slate-500 uppercase tracking-tighter border-b border-slate-700/50">
                                                <th className="w-12 py-3 text-center">№</th>
                                                <th className="px-2 py-3">Дата / Тип</th>
                                                <th className="px-2 py-3 text-center">Сумма</th>
                                                <th className="px-2 py-3 text-center pr-4">Остаток</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-700/30">
                                            {calculations.schedule.map((row) => (
                                                <tr key={row.id} className="hover:bg-slate-700/20 transition-colors group">
                                                    <td className="py-4 text-[10px] font-bold text-center text-slate-500 italic border-r border-slate-700/20">{row.id}</td>
                                                    <td className="px-2 py-4">
                                                        <div className="text-[11px] font-black text-slate-300">{row.date}</div>
                                                        <div className={`text-[8px] font-black uppercase tracking-tighter italic ${row.label === 'Взнос' ? 'text-emerald-500' : 'text-blue-500'}`}>
                                                            {row.label}
                                                        </div>
                                                    </td>
                                                    <td className="px-2 py-4 text-center">
                                                        <div className="text-[13px] font-black text-slate-100 tracking-tight">{row.pay.toLocaleString('ru-RU')} ₽</div>
                                                    </td>
                                                    <td className="px-2 py-4 text-center text-[10px] font-bold text-slate-400/80 tabular-nums pr-4">
                                                        {row.remain.toLocaleString('ru-RU')} ₽
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                    {calculations.schedule.length === 0 && (
                                        <div className="py-20 text-center opacity-20 flex flex-col items-center gap-2 font-black uppercase tracking-[0.2em] text-[9px] italic">
                                            <Icon name="info" className="w-6 h-6" />
                                            Ожидание данных
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>

                    {showToast && (
                        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 w-[90%] max-w-xs">
                            <div className="toast bg-blue-600 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center justify-center gap-2 border border-blue-400/30">
                                <Icon name="check-circle" className="w-4 h-4" />
                                <span className="text-[10px] font-bold uppercase tracking-widest text-center">Расчет скопирован!</span>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
